<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日田市AEDナビ｜最寄りのAEDまでの最短経路</title>
  <meta name="description" content="大分県日田市内で、現在地から最も近いAEDまでの徒歩での最短経路を表示します。">
  <meta name="theme-color" content="#00794c">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <main id="map" class="map" aria-label="AEDの位置と経路を示す地図"></main>

    <aside class="panel">
      <header class="head">
        <h1>日田市AEDナビ<small>大分県日田市</small></h1>
        <a class="call" href="tel:119">119番に電話</a>
      </header>

      <p class="advice">
        人が倒れていたら、まず119番通報。AEDは周りの人に取りに行ってもらいましょう。
      </p>

      <div class="actions">
        <button id="btnLocate" class="btn primary" type="button" disabled>現在地から最寄りのAEDを探す</button>
        <button id="btnPick" class="btn secondary" type="button" aria-pressed="false" disabled>地図をタップして出発地を指定</button>
        <label class="check">
          <input id="chk24" type="checkbox">
          <span>24時間使えるAEDのみ</span>
        </label>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">AEDデータを読み込み中…</p>

      <section id="result" class="card result" aria-live="polite" hidden></section>

      <section id="candidates" class="candidates" hidden>
        <h2>近くのAED</h2>
        <ol id="candList" class="cand-list"></ol>
      </section>

      <footer class="foot">
        <p id="dataInfo"></p>
        <p>対象地域: 大分県日田市</p>
        <p>
          地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>
          ／ 経路: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
        </p>
        <p>AEDの設置状況・利用時間は変更されている場合があります。</p>
      </footer>
    </aside>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
